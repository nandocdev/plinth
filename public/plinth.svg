<svg width="640" height="180" viewBox="0 0 640 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plinthGradient" x1="40" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="180" rx="24" fill="#0F172A"/>

  <!-- Symbol -->
  <g transform="translate(40 30)">
    
    <!-- Base platform -->
    <rect x="0" y="70" width="100" height="18" rx="9" fill="url(#plinthGradient)"/>

    <!-- Left pillar -->
    <rect x="14" y="18" width="18" height="58" rx="9" fill="#E2E8F0"/>

    <!-- Right pillar -->
    <rect x="68" y="18" width="18" height="58" rx="9" fill="#E2E8F0"/>

    <!-- Top beam -->
    <rect x="6" y="0" width="88" height="18" rx="9" fill="url(#plinthGradient)"/>

    <!-- Center core -->
    <circle cx="50" cy="46" r="10" fill="#22D3EE" filter="url(#softGlow)"/>

    <!-- Tenant nodes -->
    <circle cx="50" cy="46" r="34" stroke="url(#accentGradient)" stroke-width="2" stroke-dasharray="4 6"/>

    <circle cx="50" cy="12" r="4" fill="#A78BFA"/>
    <circle cx="84" cy="46" r="4" fill="#22D3EE"/>
    <circle cx="50" cy="80" r="4" fill="#A78BFA"/>
    <circle cx="16" cy="46" r="4" fill="#22D3EE"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(180 58)">
    <text
      x="0"
      y="42"
      fill="#F8FAFC"
      font-family="Inter, Arial, sans-serif"
      font-size="52"
      font-weight="700"
      letter-spacing="-2"
    >
      plinth
    </text>

    <text
      x="4"
      y="74"
      fill="#94A3B8"
      font-family="Inter, Arial, sans-serif"
      font-size="16"
      font-weight="500"
      letter-spacing="2"
    >
      LARAVEL • LIVEWIRE • MULTI-TENANT
    </text>
  </g>
</svg>
